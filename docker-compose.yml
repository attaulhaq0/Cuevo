name: cuevo
services:
  web:
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE: web } }
    env_file: .env.local
    ports: ['3000:3000']
    healthcheck: { test: ['CMD', 'node', '-e', "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1))"], interval: 20s, timeout: 5s, retries: 3 }
  api:
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE: api } }
    env_file: .env.local
    ports: ['4000:4000']
    healthcheck: { test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/health/live').then(r=>process.exit(r.ok?0:1))"], interval: 20s, timeout: 5s, retries: 3 }
  worker:
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE: worker } }
    env_file: .env.local
    ports: ['4001:4001']
    healthcheck: { test: ['CMD', 'node', '-e', "fetch('http://localhost:4001/health/live').then(r=>process.exit(r.ok?0:1))"], interval: 20s, timeout: 5s, retries: 3 }
