name: Cuevo focused staging verification
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Original canonical main CI run to observe
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: cuevo-staging-verification-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  canonical-schema:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24.16.0', cache: npm }
      - name: Install pinned npm
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install local esbuild binary
        run: node node_modules/esbuild/install.js
      - name: Observe original canonical source and database proof
        env:
          GH_TOKEN: ${{ github.token }}
          CUEVO_CANONICAL_CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: node --import tsx scripts/verification/staging-verification.ts
      - name: Confirm frozen authored source
        run: git diff --exit-code HEAD -- && test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test -z "$(git ls-files --others --exclude-standard)"
      - name: Retain canonical observation only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuevo-schema-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/staging-schema/observation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
