name: Cuevo reviewed backend schema release
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact current main commit with successful Cuevo verification
        required: true
        type: string
      ci_run_id:
        description: Successful canonical main push verification run
        required: true
        type: string
      scope:
        description: Schema/accounts milestone complete backend or installed runtime verification
        required: true
        type: choice
        default: schema-and-accounts
        options: [schema-and-accounts, complete-backend, installed-runtime, reconcile-schema, pending-runtime-confirmation, runtime-rollout]
      handoff:
        description: Operating synthetic staging or full customer candidate prerequisites
        required: true
        type: choice
        default: operating-staging
        options: [operating-staging, customer-candidate]
      runtime_action:
        description: Optional runtime-rollout action ROLL_FORWARD RECOVER_ORIGINAL or ROLL_BACK
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: cuevo-backend-release
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      bundle-path: ${{ steps.prepare.outputs.bundle-path }}
      bundle-sha256: ${{ steps.prepare.outputs.bundle-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Prepare exact source and read-only project package
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_BACKEND_RELEASE_INPUT_JSON: ${{ vars.CUEVO_BACKEND_RELEASE_INPUT_JSON }}
        run: node --import tsx scripts/verification/backend-release.ts prepare
      - name: Retain this run's secret-free staged package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuevo-backend-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/hosted-release/
            .local/runtime-artifacts/api-vercel/
            .local/edge-artifacts/cuevo-worker/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
  schema:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Read only this run's prepared package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cuevo-backend-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/
      - name: Re-admit official founder package before private credentials
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts approval
      - name: Bootstrap fixed operator bucket and apply original schema stages
        if: inputs.scope == 'schema-and-accounts' || inputs.scope == 'complete-backend'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_DATABASE_TLS_CA: ${{ secrets.CUEVO_DATABASE_TLS_CA }}
          CUEVO_RELEASE_JOURNAL_STORAGE_KEY: ${{ secrets.CUEVO_RELEASE_JOURNAL_STORAGE_KEY }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts bootstrap-schema
      - name: Reconcile exact interrupted prefix and execute its original three pending migrations
        if: inputs.scope == 'reconcile-schema'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_DATABASE_TLS_CA: ${{ secrets.CUEVO_DATABASE_TLS_CA }}
          CUEVO_RELEASE_JOURNAL_STORAGE_KEY: ${{ secrets.CUEVO_RELEASE_JOURNAL_STORAGE_KEY }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts reconcile-prefix
      - name: Export confirmed original schema recovery completion
        if: inputs.scope == 'reconcile-schema'
        id: schema-completion
        env:
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts export-schema-completion
      - name: Retain confirmed schema recovery completion
        if: inputs.scope == 'reconcile-schema'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuevo-schema-recovery-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/hosted-release/schema-recovery-completion.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Provision original synthetic reference population and Auth identities
        if: inputs.scope == 'schema-and-accounts' || inputs.scope == 'complete-backend'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_DATABASE_TLS_CA: ${{ secrets.CUEVO_DATABASE_TLS_CA }}
          CUEVO_RELEASE_JOURNAL_STORAGE_KEY: ${{ secrets.CUEVO_RELEASE_JOURNAL_STORAGE_KEY }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts provision
      - name: Revalidate original active runtime without provider deployment
        if: inputs.scope == 'installed-runtime'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_DATABASE_TLS_CA: ${{ secrets.CUEVO_DATABASE_TLS_CA }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts resume-runtime
      - name: Install pinned API deployment CLI
        if: inputs.scope == 'complete-backend'
        run: npm install --global vercel@62.1.0 --ignore-scripts --no-audit --no-fund
      - name: Deploy current API and inactive Edge worker
        if: inputs.scope == 'complete-backend'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_DATABASE_TLS_CA: ${{ secrets.CUEVO_DATABASE_TLS_CA }}
          CUEVO_RELEASE_JOURNAL_STORAGE_KEY: ${{ secrets.CUEVO_RELEASE_JOURNAL_STORAGE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts deploy
      - name: Verify hosted current-role and endpoint prerequisites
        if: inputs.scope == 'complete-backend' || inputs.scope == 'installed-runtime'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts verify
      - name: Verify restricted database private files and channel access
        if: inputs.scope == 'complete-backend' || inputs.scope == 'installed-runtime'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts verify-private
      - name: Verify signed worker execution and scheduled recovery
        if: inputs.scope == 'complete-backend'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts activate
      - name: Initialize retained runtime generation
        if: inputs.scope == 'complete-backend' && inputs.handoff == 'operating-staging'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_DATABASE_TLS_CA: ${{ secrets.CUEVO_DATABASE_TLS_CA }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts initialize-runtime
      - name: Roll out reviewed runtime generation
        id: runtime-rollout
        if: inputs.scope == 'runtime-rollout' && inputs.handoff == 'operating-staging'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_DATABASE_TLS_CA: ${{ secrets.CUEVO_DATABASE_TLS_CA }}
          CUEVO_RELEASE_JOURNAL_STORAGE_KEY: ${{ secrets.CUEVO_RELEASE_JOURNAL_STORAGE_KEY }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts rollout-runtime
      - name: Export original runtime rollout recovery evidence
        if: always() && inputs.scope == 'runtime-rollout' && (inputs.runtime_action == '' || inputs.runtime_action == 'ROLL_FORWARD') && (steps.runtime-rollout.outcome == 'failure' || steps.runtime-rollout.outcome == 'cancelled')
        id: runtime-recovery-export
        env:
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts export-runtime-recovery
      - name: Retain original runtime rollout recovery evidence
        if: always() && inputs.scope == 'runtime-rollout' && (inputs.runtime_action == '' || inputs.runtime_action == 'ROLL_FORWARD') && (steps.runtime-rollout.outcome == 'failure' || steps.runtime-rollout.outcome == 'cancelled') && steps.runtime-recovery-export.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuevo-runtime-rollout-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/hosted-release/runtime-rollout-recovery.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Export immutable original worker execution evidence
        id: original-worker-export
        if: always() && inputs.scope == 'complete-backend'
        env:
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts export-activation-execution
      - name: Retain original worker activation execution evidence
        if: always() && inputs.scope == 'complete-backend' && steps.original-worker-export.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuevo-worker-activation-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/hosted-release/worker-activation-execution-export.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Confirm pending original worker activation
        if: inputs.scope == 'pending-runtime-confirmation'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_DATABASE_TLS_CA: ${{ secrets.CUEVO_DATABASE_TLS_CA }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts confirm-pending-activation
      - name: Verify original worker lease retry and backoff recovery
        if: (inputs.scope == 'complete-backend' || inputs.scope == 'installed-runtime') && inputs.handoff == 'customer-candidate'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts verify-recovery
      - name: Acquire the exact isolated restoration image
        if: (inputs.scope == 'complete-backend' || inputs.scope == 'installed-runtime') && inputs.handoff == 'customer-candidate'
        run: docker pull public.ecr.aws/supabase/postgres@sha256:0450166354dc9c1d25f0322ac8b580774d4fb0184d2b087f6e4fe9499c66cf53
      - name: Verify isolated database and owned private-file restoration
        if: (inputs.scope == 'complete-backend' || inputs.scope == 'installed-runtime') && inputs.handoff == 'customer-candidate'
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts verify-restore
      - name: Bind the verified API to its reserved staging origin
        if: inputs.scope == 'complete-backend' || inputs.scope == 'installed-runtime'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts bind-api
      - name: Prepare the frontend manifest from verified backend receipts
        if: inputs.scope == 'installed-runtime'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_RELEASE_JOURNAL_STORAGE_KEY: ${{ secrets.CUEVO_RELEASE_JOURNAL_STORAGE_KEY }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts handover
      - name: Configure only verified public frontend settings
        if: inputs.scope == 'installed-runtime'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_RELEASE_JOURNAL_STORAGE_KEY: ${{ secrets.CUEVO_RELEASE_JOURNAL_STORAGE_KEY }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts configure-web
      - name: Export the verified public handover for the separate web release
        if: inputs.scope == 'installed-runtime'
        id: web-transfer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_RELEASE_JOURNAL_STORAGE_KEY: ${{ secrets.CUEVO_RELEASE_JOURNAL_STORAGE_KEY }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts export-web-handover
      - name: Retain only the completed backend public handover
        if: inputs.scope == 'installed-runtime'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuevo-web-handover-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/hosted-release/web-transfer.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
      - name: Preserve schema status without private runtime inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuevo-backend-schema-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/hosted-release/bucket-result.json
            .local/hosted-release/schema-result.json
            .local/hosted-release/journal-*/
            .local/hosted-release/population-result.json
            .local/hosted-release/auth-result.json
            .local/hosted-release/reference-result.json
            .local/hosted-release/runtime-roles-result.json
            .local/hosted-release/runtime-resume-result.json
            .local/hosted-release/provider-result.json
            .local/hosted-release/provider-deployment-intent.json
            .local/hosted-release/protected-preview-api-intent.json
            .local/hosted-release/protected-preview-api-result.json
            .local/hosted-release/prerequisites-result.json
            .local/hosted-release/private-access-result.json
            .local/hosted-release/private-probe-*-intent.json
            .local/hosted-release/private-probe-*-asset.json
            .local/hosted-release/private-probe-*-room.json
            .local/hosted-release/private-probe-*-result.json
            .local/hosted-release/data-api-configuration.json
            .local/hosted-release/worker-activation-identity.json
            .local/hosted-release/worker-activation-execution-result.json
