name: Cuevo reviewed backend schema release
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact current main commit with successful Cuevo verification
        required: true
        type: string
      ci_run_id:
        description: Successful canonical main push verification run
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: cuevo-backend-release
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      bundle-path: ${{ steps.prepare.outputs.bundle-path }}
      bundle-sha256: ${{ steps.prepare.outputs.bundle-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Prepare exact source and read-only project package
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_BACKEND_RELEASE_INPUT_JSON: ${{ vars.CUEVO_BACKEND_RELEASE_INPUT_JSON }}
        run: node --import tsx scripts/verification/backend-release.ts prepare
      - name: Retain this run's secret-free staged package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuevo-backend-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/hosted-release/
            .local/runtime-artifacts/api-vercel/
            .local/edge-artifacts/cuevo-worker/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
  schema:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Read only this run's prepared package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cuevo-backend-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/
      - name: Re-admit official founder package before private credentials
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts approval
      - name: Bootstrap fixed operator bucket and apply original schema stages
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_DATABASE_TLS_CA: ${{ secrets.CUEVO_DATABASE_TLS_CA }}
          CUEVO_RELEASE_JOURNAL_STORAGE_KEY: ${{ secrets.CUEVO_RELEASE_JOURNAL_STORAGE_KEY }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts bootstrap-schema
      - name: Provision original synthetic reference population and Auth identities
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_DATABASE_TLS_CA: ${{ secrets.CUEVO_DATABASE_TLS_CA }}
          CUEVO_RELEASE_JOURNAL_STORAGE_KEY: ${{ secrets.CUEVO_RELEASE_JOURNAL_STORAGE_KEY }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts provision
      - name: Install pinned API deployment CLI
        run: npm install --global vercel@62.1.0 --ignore-scripts --no-audit --no-fund
      - name: Deploy current API and inactive Edge worker
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_DATABASE_TLS_CA: ${{ secrets.CUEVO_DATABASE_TLS_CA }}
          CUEVO_RELEASE_JOURNAL_STORAGE_KEY: ${{ secrets.CUEVO_RELEASE_JOURNAL_STORAGE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts deploy
      - name: Verify hosted current-role and endpoint prerequisites
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts verify
      - name: Verify restricted database private files and channel access
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts verify-private
      - name: Verify signed worker execution and scheduled recovery
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_DATA_API_CONFIGURATION_EVIDENCE_JSON: ${{ vars.CUEVO_DATA_API_CONFIGURATION_EVIDENCE_JSON }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts activate
      - name: Verify original worker lease retry and backoff recovery
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts verify-recovery
      - name: Acquire the exact isolated restoration image
        run: docker pull public.ecr.aws/supabase/postgres@sha256:0450166354dc9c1d25f0322ac8b580774d4fb0184d2b087f6e4fe9499c66cf53
      - name: Verify isolated database and owned private-file restoration
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_MIGRATION_DATABASE_PASSWORD: ${{ secrets.CUEVO_MIGRATION_DATABASE_PASSWORD }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts verify-restore
      - name: Bind the verified API to its reserved staging origin
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_SYNTHETIC_PILOT_PASSWORD: ${{ secrets.CUEVO_SYNTHETIC_PILOT_PASSWORD }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts bind-api
      - name: Prepare the frontend manifest from verified backend receipts
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts handover
      - name: Configure only verified public frontend settings
        env:
          GH_TOKEN: ${{ secrets.CUEVO_GITHUB_RELEASE_METADATA_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CUEVO_BACKEND_BUNDLE_PATH: ${{ needs.prepare.outputs.bundle-path }}
          CUEVO_BACKEND_BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: node --import tsx scripts/verification/backend-release.ts configure-web
      - name: Preserve schema status without private runtime inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuevo-backend-schema-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/hosted-release/bucket-result.json
            .local/hosted-release/schema-result.json
            .local/hosted-release/journal-*/
            .local/hosted-release/population-result.json
            .local/hosted-release/auth-result.json
            .local/hosted-release/reference-result.json
            .local/hosted-release/runtime-roles-result.json
            .local/hosted-release/provider-result.json
            .local/hosted-release/provider-deployment-intent.json
            .local/hosted-release/prerequisites-result.json
            .local/hosted-release/private-access-result.json
            .local/hosted-release/private-probe-*-intent.json
            .local/hosted-release/private-probe-*-asset.json
            .local/hosted-release/private-probe-*-room.json
            .local/hosted-release/private-probe-*-result.json
            .local/hosted-release/data-api-configuration.json
            .local/hosted-release/worker-activation-intent.json
            .local/hosted-release/worker-activation-journal.jsonl
            .local/hosted-release/worker-activation-result.json
            .local/hosted-release/worker-activation-cleanup.json
            .local/hosted-release/worker-fault-recovery-intent.json
            .local/hosted-release/worker-fault-recovery-journal.jsonl
            .local/hosted-release/worker-fault-recovery-provisional.json
            .local/hosted-release/worker-fault-recovery-result.json
            .local/hosted-release/worker-fault-recovery-cleanup.json
            .local/hosted-release/database-restore-intent.json
            .local/hosted-release/database-restore-asset.json
            .local/hosted-release/database-restore-result.json
            .local/hosted-release/database-restore-cleanup.json
            .local/hosted-release/api-origin-intent.json
            .local/hosted-release/api-origin-result.json
            .local/hosted-release/web-handover-result.json
            .local/hosted-release/web-handover-manifest.json
            .local/hosted-release/web-handover-public.json
            .local/hosted-release/web-settings-intent.json
            .local/hosted-release/web-settings-result.json
            .local/hosted-release/population-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
