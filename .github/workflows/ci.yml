          CONTRACTS: ${{ needs.source-fixtures-contracts.result }}
          DELIVERY: ${{ needs.source-fixtures-delivery.result }}
        run: test "$NATIVE" = success && test "$CONTRACTS" = success && test "$DELIVERY" = success && test '${{ needs.source-cohort-continuation-1.result }}' = success && test '${{ needs.source-cohort-continuation-2.result }}' = success && test '${{ needs.source-cohort-continuation-3.result }}' = success && test '${{ needs.source-cohort-continuation-4.result }}' = success && test '${{ needs.source-cohort-continuation-5.result }}' = success && test '${{ needs.source-cohort-reconciliation-1.result }}' = success && test '${{ needs.source-cohort-reconciliation-2.result }}' = success && node --import tsx scripts/verification/stateless-source-aggregate.ts
