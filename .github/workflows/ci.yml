        with:
          name: cuevo-source-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/verification/source-contracts/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Confirm frozen authored source
        run: git diff --exit-code HEAD -- && test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test -z "$(git ls-files --others --exclude-standard)"
  database-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Build exact source child144 catalogue reference
        run: node --import tsx scripts/database/hosted-child-catalogue-producer.ts
      - name: Verify isolated database boundary
        run: node --import tsx scripts/verification/technical-exit.ts --profile=ci --lane=database
      - name: Retain exact safe database lane
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-runtime-database-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/runtime-lanes/database/lane.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain exact source child144 catalogue reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-child144-catalogue-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/child144-catalogue/reference.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain exact source native180 catalogue reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-native180-catalogue-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/child144-catalogue/source180.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain exact source original231 catalogue reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-original231-catalogue-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/child144-catalogue/source231.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain minimized source child144 failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-child144-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/child144-catalogue/failure.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Stop owned local Supabase
        if: always()
        run: npx --no-install supabase stop --project-id cuevo
  runtime-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Verify isolated backend runtime
        run: node --import tsx scripts/verification/technical-exit.ts --profile=ci --lane=backend
      - name: Retain exact safe backend lane
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-runtime-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/runtime-lanes/backend/lane.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Bind verified runtime delivery artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node --import tsx scripts/verification/runtime-artifact-receipt.ts
      - name: Retain verified runtime delivery artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-runtime-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/runtime-artifacts/api-vercel/
            .local/edge-artifacts/cuevo-worker/
            .local/runtime-artifact-receipt.json
            .local/runtime-contract-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Stop owned local Supabase
        if: always()
        run: npx --no-install supabase stop --project-id cuevo
  runtime-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify isolated focused browser runtime
        run: node --import tsx scripts/verification/technical-exit.ts --profile=ci --lane=browser
      - name: Retain exact safe browser lane
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-runtime-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/runtime-lanes/browser/lane.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain minimized local start failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-start-diagnostic-runtime-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/migration-replay/operation-*/start-diagnostic.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Retain minimized local reset failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-reset-diagnostic-runtime-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/migration-replay/operation-*/reset-diagnostic.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Stop owned local Supabase
        if: always()
        run: npx --no-install supabase stop --project-id cuevo
  technical-mvp:
    if: always()
    needs:
      - database-checks
      - runtime-backend
      - runtime-browser
      - integration-learning
      - integration-state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Read exact backend lane from this run attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cuevo-runtime-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/runtime-lane-inputs/backend
      - name: Read exact browser lane from this run attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cuevo-runtime-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/runtime-lane-inputs/browser
      - name: Read exact database lane from this run attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cuevo-runtime-database-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/runtime-lane-inputs/database
      - name: Read exact integration-learning partition from this run attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cuevo-integration-integration-learning-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/integration-partition-inputs/integration-learning
      - name: Read exact integration-state partition from this run attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cuevo-integration-integration-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/integration-partition-inputs/integration-state
      - name: Combine exact source and required runtime lanes
        env:
          DATABASE: ${{ needs.database-checks.result }}
          BACKEND: ${{ needs.runtime-backend.result }}
          BROWSER: ${{ needs.runtime-browser.result }}
          LEARNING: ${{ needs.integration-learning.result }}
          STATE: ${{ needs.integration-state.result }}
        run: test "$DATABASE" = success && test "$BACKEND" = success && test "$BROWSER" = success && test "$LEARNING" = success && test "$STATE" = success && node --import tsx scripts/verification/runtime-lane-aggregate.ts
      - name: Retain original complete runtime aggregate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-runtime-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/runtime-aggregate/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Export sanitized status evidence
        if: always()
        run: node --import tsx scripts/verification/cicd-evidence.ts
      - name: Retain sanitized evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-safe-${{ github.sha }}
          path: .local/cicd-safe/
          retention-days: 14
          if-no-files-found: error
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
  codeql:
    concurrency:
      group: cuevo-codeql-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.16.0
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        id: codeql-analyze
        with:
          wait-for-processing: true
      - name: Require current processed CodeQL security findings to be clear
        env:
          GH_TOKEN: ${{ github.token }}
          CUEVO_CODEQL_SARIF_ID: ${{ steps.codeql-analyze.outputs.sarif-id }}
        run: node --import tsx scripts/verification/codeql-alerts.ts
      - name: Retain original processed CodeQL receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-codeql-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/codeql-receipt/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Verify pinned scanner and scan full history plus authored worktree
        run: node --import tsx --test scripts/verification/secret-scan-policy.test.ts scripts/verification/secret-scan.test.ts
      - name: Scan full history plus authored worktree
        run: node --import tsx scripts/verification/secret-scan.ts
  required:
    if: always()
    needs:
      - fast-checks
      - source-contracts
      - database-checks
      - technical-mvp
      - dependency-review
      - codeql
      - secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification boundary
        env:
          FAST: ${{ needs.fast-checks.result }}
          SOURCE_CONTRACTS: ${{ needs.source-contracts.result }}
          DATABASE: ${{ needs.database-checks.result }}
          TECHNICAL: ${{ needs.technical-mvp.result }}
          DEPENDENCY: ${{ needs.dependency-review.result }}
          CODEQL: ${{ needs.codeql.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          if [ "$FAST" != success ] || [ "$SOURCE_CONTRACTS" != success ] || [ "$DATABASE" != success ] || [ "$TECHNICAL" != success ] || [ "$CODEQL" != success ] || [ "$SECRET_SCAN" != success ]; then exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then test "$DEPENDENCY" = success; else test "$DEPENDENCY" = skipped; fi
  integration-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
