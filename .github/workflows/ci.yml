name: Cuevo verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cuevo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.16.0', cache: npm }
      - name: Observe hosted database network reachability without credentials
        run: node --experimental-strip-types scripts/verification/hosted-connectivity.ts
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - run: npm run lint && npm run typecheck && npm test
      - name: Confirm frozen authored source
        run: git diff --exit-code HEAD -- && test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test -z "$(git ls-files --others --exclude-standard)"
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - run: node --import tsx scripts/verification/stateless-checks.ts
      - name: Confirm frozen authored source
        run: git diff --exit-code HEAD -- && test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test -z "$(git ls-files --others --exclude-standard)"
  runtime-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Verify isolated backend runtime
        run: node --import tsx scripts/verification/technical-exit.ts --profile=ci --lane=backend
      - name: Retain exact safe backend lane
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuevo-runtime-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/runtime-lanes/backend/lane.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Stop owned local Supabase
        if: always()
        run: npx --no-install supabase stop --project-id cuevo
  runtime-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify isolated focused browser runtime
        run: node --import tsx scripts/verification/technical-exit.ts --profile=ci --lane=browser
      - name: Retain exact safe browser lane
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuevo-runtime-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/runtime-lanes/browser/lane.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Stop owned local Supabase
        if: always()
        run: npx --no-install supabase stop --project-id cuevo
  technical-mvp:
    needs: [runtime-backend, runtime-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Read exact backend lane from this run attempt
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: cuevo-runtime-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/runtime-lane-inputs/backend
      - name: Read exact browser lane from this run attempt
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: cuevo-runtime-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/runtime-lane-inputs/browser
      - name: Combine exact source and required runtime lanes
        run: node --import tsx scripts/verification/runtime-lane-aggregate.ts
      - name: Export sanitized status evidence
        if: always()
        run: node --import tsx scripts/verification/cicd-evidence.ts
      - name: Retain sanitized evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuevo-safe-${{ github.sha }}
          path: .local/cicd-safe/
          retention-days: 14
          if-no-files-found: error
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with: { fail-on-severity: moderate, comment-summary-in-pr: never }
  codeql:
    concurrency:
      group: cuevo-codeql-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.16.0' }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with: { languages: javascript-typescript, build-mode: none }
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        id: codeql-analyze
        with: { wait-for-processing: true }
      - name: Require current processed CodeQL security findings to be clear
        env:
          GH_TOKEN: ${{ github.token }}
          CUEVO_CODEQL_SARIF_ID: ${{ steps.codeql-analyze.outputs.sarif-id }}
        run: node --import tsx scripts/verification/codeql-alerts.ts
      - name: Retain original processed CodeQL receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuevo-codeql-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/codeql-receipt/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Verify pinned scanner and scan full history plus authored worktree
        run: node --import tsx --test scripts/verification/secret-scan-policy.test.ts scripts/verification/secret-scan.test.ts
      - name: Scan full history plus authored worktree
        run: node --import tsx scripts/verification/secret-scan.ts
  required:
    if: always()
    needs: [fast-checks, source-contracts, technical-mvp, dependency-review, codeql, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification boundary
        env:
          FAST: ${{ needs.fast-checks.result }}
          SOURCE_CONTRACTS: ${{ needs.source-contracts.result }}
          TECHNICAL: ${{ needs.technical-mvp.result }}
          DEPENDENCY: ${{ needs.dependency-review.result }}
          CODEQL: ${{ needs.codeql.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          if [ "$FAST" != success ] || [ "$SOURCE_CONTRACTS" != success ] || [ "$TECHNICAL" != success ] || [ "$CODEQL" != success ] || [ "$SECRET_SCAN" != success ]; then exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then test "$DEPENDENCY" = success; else test "$DEPENDENCY" = skipped; fi
