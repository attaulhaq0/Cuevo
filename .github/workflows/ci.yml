          cache: npm
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Verify isolated integration-learning partition
        run: node --import tsx scripts/verification/technical-exit.ts --profile=ci --ci-partition=integration-learning
      - name: Retain exact integration-learning partition
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-integration-integration-learning-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/integration-partitions/integration-learning/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Stop owned local Supabase
        if: always()
        run: npx --no-install supabase stop --project-id cuevo
  integration-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Verify isolated integration-state partition
        run: node --import tsx scripts/verification/technical-exit.ts --profile=ci --ci-partition=integration-state
      - name: Retain exact integration-state partition
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-integration-integration-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/integration-partitions/integration-state/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain minimized local reset failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-reset-diagnostic-integration-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/migration-replay/operation-*/reset-diagnostic.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Retain minimized local start failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuevo-start-diagnostic-integration-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/migration-replay/operation-*/start-diagnostic.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Stop owned local Supabase
        if: always()
        run: npx --no-install supabase stop --project-id cuevo
