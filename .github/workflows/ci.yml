name: Cuevo verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: cuevo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - run: node --import tsx --test scripts/verification/cicd-contracts.test.ts
      - run: node --import tsx scripts/verification/cicd-check.ts
      - run: npm run check:repository && npm run test:repository && npm run check:architecture && npm run test:architecture && npm run check:docs && npm run test:docs
      - run: npm run lint && npm run typecheck && npm test
  technical-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run verify:technical
      - name: Build local Docker images
        run: docker compose --env-file .env.local build
      - name: Build compiled runtime images
        run: |
          docker build -f docker/Dockerfile.runtime --build-arg SERVICE=api -t cuevo-api:${{ github.sha }} .
          docker build -f docker/Dockerfile.runtime --build-arg SERVICE=worker -t cuevo-worker:${{ github.sha }} .
      - name: Export sanitized status evidence
        if: always()
        run: node --import tsx scripts/verification/cicd-evidence.ts
      - name: Retain sanitized evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuevo-safe-${{ github.sha }}
          path: .local/cicd-safe/
          retention-days: 14
          if-no-files-found: error
      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop --project-id cuevo
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with: { fail-on-severity: moderate, comment-summary-in-pr: never }
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with: { languages: javascript-typescript, build-mode: none }
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
  required:
    if: always()
    needs: [fast-checks, technical-mvp, dependency-review, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification boundary
        env:
          FAST: ${{ needs.fast-checks.result }}
          TECHNICAL: ${{ needs.technical-mvp.result }}
          DEPENDENCY: ${{ needs.dependency-review.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          if [ "$FAST" != success ] || [ "$TECHNICAL" != success ] || [ "$CODEQL" != success ]; then exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then test "$DEPENDENCY" = success; else test "$DEPENDENCY" = skipped; fi
