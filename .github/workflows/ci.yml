name: Cuevo verification
on: [push, pull_request]
permissions:
  contents: read
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  technical-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run verify:technical
      - name: Build local Docker images
        run: docker compose --env-file .env.local build
      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop --project-id cuevo
