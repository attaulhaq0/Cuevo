name: Cuevo daily regression watchdog
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cuevo-daily-watchdog
  cancel-in-progress: false
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  watchdog:
    if: github.repository == 'attaulhaq0/Cuevo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.16.0', cache: npm }
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/esbuild/install.js
      - name: Observe latest eligible daily regression with read-only GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CUEVO_WATCHDOG_SCHEDULE: ${{ github.event.schedule }}
          CUEVO_DAILY_REGRESSION_FIRST_EXPECTED_DATE: ${{ vars.CUEVO_DAILY_REGRESSION_FIRST_EXPECTED_DATE }}
        run: node --import tsx scripts/verification/daily-watchdog.ts
