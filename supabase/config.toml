project_id = "cuevo"

[api]
enabled = true
port = 56321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 56324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:3000/account/admission", "http://localhost:3000/account/recovery", "http://127.0.0.1:3000/account/admission", "http://127.0.0.1:3000/account/recovery"]
jwt_expiry = 900
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# CLI maps this provider flag to GOTRUE_EXTERNAL_EMAIL_ENABLED. Global signup stays disabled.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[realtime]
enabled = true

[analytics]
enabled = false
port = 56327

[edge_runtime]
enabled = false

# Generated delivery artifact only; implementation stays apps/worker/src/edge.ts.
# Machine wake authentication is validated by the handler before opening the DB.
[functions.cuevo-worker]
enabled = true
verify_jwt = false
entrypoint = '../.local/verification/edge-serving/cuevo-worker/index.ts'
import_map = '../.local/verification/edge-serving/cuevo-worker/deno.json'
